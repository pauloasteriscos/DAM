name: dailytalk_mobile
description: "Aplicação móvel e Web do DailyTalk.pt para aprendizagem gamificada de idiomas em contexto de mobilidade escolar."
# Impede a publicação acidental deste projeto no pub.dev.
# O DailyTalk.pt é uma aplicação e não um pacote destinado a publicação no pub.dev.
publish_to: 'none'

# Versão da aplicação no formato MAJOR.MINOR.PATCH+BUILD.
# MAJOR representa alterações incompatíveis ou mudanças estruturais relevantes.
# MINOR representa evolução funcional compatível.
# PATCH representa correções e melhorias compatíveis.
# O número após "+" identifica o build e deve aumentar a cada nova release.
# No Android, a versão é usada como versionName e o build como versionCode.
# No iOS, correspondem a CFBundleShortVersionString e CFBundleVersion.
# No Windows, a versão identifica major, minor e patch, e o build funciona como sufixo.
version: 1.0.13+13

environment:
  sdk: ^3.11.5

# Dependências utilizadas em tempo de execução.
# As atualizações são realizadas de forma deliberada e validadas antes da incorporação.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Ícones de estilo Cupertino utilizados quando necessário na interface.
  cupertino_icons: ^1.0.8

  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.8.0
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter
  # SQLite nativo utilizado nos testes e validações de migração.
  sqflite_common_ffi: 2.4.3

  # Regras de análise estática utilizadas pelo projeto.
  # A configuração complementar encontra-se em analysis_options.yaml.
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#00843D"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"


# Configuração específica da aplicação Flutter.
flutter:

  # Inclui a fonte Material Icons utilizada pela interface.
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/content/
